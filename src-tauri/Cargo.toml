[package]
name = "rack42"
version = "0.1.0"
description = "Rack42 - local-first rack and infrastructure manager"
authors = ["guxin0123"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rack42_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
thiserror = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
open = "5"
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
# Thin LTO + parallel codegen keeps packaging builds reasonably fast while
# still producing a small binary. Use `lto = "fat"` + codegen-units = 1 only
# for a final release where build time is not a concern.
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

# MSVC 14.51 在编译 bundled SQLite 时会因 /Z7 调试记录过长报 D8050，
# 仅关闭该依赖的 C 调试信息，不影响应用自身的调试符号。
[profile.dev.package.libsqlite3-sys]
debug = false
